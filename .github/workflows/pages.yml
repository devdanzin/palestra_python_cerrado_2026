# Publica a apresentação (apresentacao/) no GitHub Pages.
# O deck fica servido na raiz do site: cerrado.html vira index.html.
# O tema claro continua acessível por ?tema=claro (ver dist/theme/claro.css).
name: Publicar slides no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apresentacao/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir _site
          cp -r apresentacao/. _site/
          # O deck é a página inicial do site.
          mv _site/cerrado.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
